<title>Gabriel's Snack Shop</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9800,#ffd54f);
    min-height:100vh;
    overflow-x:hidden;
}

/* Floating snack emojis */
.float{
    position:fixed;
    font-size:40px;
    opacity:0.5;
    pointer-events:none;
    z-index:0;
}

.float1{
    left:10%;
    animation:floatUp 8s linear infinite;
}

.float2{
    left:50%;
    animation:floatUp 10s linear infinite;
}

.float3{
    left:85%;
    animation:floatUp 7s linear infinite;
}

@keyframes floatUp{
    from{
        top:110%;
    }
    to{
        top:-100px;
    }
}

/* Header */

header{
    text-align:center;
    color:white;
    padding:40px 20px;
    animation:slideDown 1s ease;
    position:relative;
    z-index:1;
}

header h1{
    font-size:3rem;
    text-shadow:3px 3px 10px rgba(0,0,0,0.3);
}
